<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store | Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; margin: 0 4px; transition: 0.3s; }
        .active-dot { background: #2563eb; width: 20px; border-radius: 10px; }
        
        /* Banner Smooth Transition */
        #bannerSlider {
            display: flex;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">

    <nav class="bg-white shadow-sm sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="document.getElementById('sideMenu').classList.remove('hidden')" class="text-xl text-gray-700 hover:text-blue-600 focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="text-2xl font-black text-blue-600 tracking-tighter">STORE</h1>
            </div>
            <div id="userTools" class="flex items-center gap-3">
                <button onclick="openAuth()" id="loginBtn" class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-sm font-bold shadow-md shadow-blue-200">Login</button>
                <div id="userInfo" class="hidden flex items-center gap-3">
                    <button onclick="openOrders()" class="text-blue-600 text-xs font-bold flex items-center gap-1">
                        <i class="fa-solid fa-box-open"></i> My Orders
                    </button>
                    <button onclick="logout()" class="text-red-500 text-xs font-bold bg-red-50 p-2 rounded-lg">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="sideMenu" class="fixed inset-0 bg-black/60 hidden z-[100] transition-opacity flex">
        <div class="w-64 bg-white h-full shadow-2xl flex flex-col z-[101]">
            <div class="p-5 bg-blue-600 text-white flex justify-between items-center">
                <h2 class="font-bold text-lg">Menu</h2>
                <button onclick="closeSideMenu()" class="text-2xl leading-none">&times;</button>
            </div>
            <div class="flex flex-col p-3 space-y-2 mt-2">
                <button onclick="closeSideMenu(); document.getElementById('catSlider').scrollIntoView({behavior: 'smooth'});" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-layer-group w-5 text-blue-500"></i> Category</button>
                <button onclick="closeSideMenu(); openOrders();" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-box-open w-5 text-blue-500"></i> My Orders</button>
                <button onclick="closeSideMenu(); alert('WhatsApp: +923423944508');" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-phone w-5 text-blue-500"></i> Contact us</button>
            </div>
        </div>
        <div class="flex-1" onclick="closeSideMenu()"></div> 
    </div>

    <div class="max-w-6xl mx-auto p-4">
        
        <div class="relative mb-6">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
            <input type="text" id="search" placeholder="Search product name or code..." onkeyup="search()" class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm outline-blue-500 bg-white">
        </div>

        <div id="catSlider" class="flex gap-3 overflow-x-auto no-scrollbar snap-x mb-6 pb-2"></div>

        <div class="relative w-full h-40 md:h-72 mb-8 overflow-hidden rounded-2xl shadow-sm bg-white" id="bannerContainer">
            <div id="bannerSlider">
                </div>
            <div id="bannerDots" class="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5"></div>
        </div>

        <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>

    <div id="pModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let currentUser = null;
        let prods = [];

        // Auth Listener
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if(user) {
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        });

        // --- BANNER LOGIC ---
        let currentBannerIndex = 0;
        let bannerCount = 0;
        let bannerInterval;

        db.ref('banners').on('value', snap => {
            const slider = document.getElementById('bannerSlider');
            const dots = document.getElementById('bannerDots');
            slider.innerHTML = '';
            dots.innerHTML = '';
            bannerCount = 0;

            if (snap.exists()) {
                snap.forEach(child => {
                    const imgUrl = child.val().image;
                    slider.innerHTML += `<img src="${imgUrl}" class="w-full h-full object-cover flex-shrink-0" style="min-width: 100%;">`;
                    dots.innerHTML += `<div class="w-2 h-2 rounded-full bg-white/50 transition-all duration-300 banner-dot-item"></div>`;
                    bannerCount++;
                });
                updateBannerDots();
                startBannerAutoScroll();
            } else {
                // Default Placeholder
                slider.innerHTML = `<div class="w-full h-full bg-blue-100 flex items-center justify-center text-blue-400 font-bold">Welcome to Our Store</div>`;
            }
        });

        function startBannerAutoScroll() {
            clearInterval(bannerInterval);
            if (bannerCount <= 1) return;
            bannerInterval = setInterval(() => {
                currentBannerIndex = (currentBannerIndex + 1) % bannerCount;
                const slider = document.getElementById('bannerSlider');
                slider.style.transform = `translateX(-${currentBannerIndex * 100}%)`;
                updateBannerDots();
            }, 4000);
        }

        function updateBannerDots() {
            const dotItems = document.querySelectorAll('.banner-dot-item');
            dotItems.forEach((dot, i) => {
                if(i === currentBannerIndex) {
                    dot.classList.add('bg-white', 'w-4');
                    dot.classList.remove('bg-white/50', 'w-2');
                } else {
                    dot.classList.remove('bg-white', 'w-4');
                    dot.classList.add('bg-white/50', 'w-2');
                }
            });
        }

        // --- LOAD CATEGORIES & PRODUCTS ---
        db.ref('categories').on('value', snap => {
            const div = document.getElementById('catSlider'); div.innerHTML = '';
            snap.forEach(child => {
                div.innerHTML += `<button onclick="filterCat('${child.val().name}')" class="bg-white border border-gray-200 min-w-[35%] py-3 px-4 rounded-2xl snap-center font-bold text-xs hover:bg-blue-600 hover:text-white transition uppercase">${child.val().name}</button>`;
            });
        });

        db.ref('products').on('value', snap => {
            prods = []; const grid = document.getElementById('grid'); grid.innerHTML = '';
            snap.forEach(child => {
                const p = child.val(); p.id = child.key; prods.push(p);
                grid.innerHTML += `
                    <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer" onclick="view('${p.id}')">
                        <div class="relative w-full h-44">
                            <img src="${p.images[0]}" class="w-full h-full object-cover">
                            <span class="absolute bottom-2 right-2 bg-black/40 text-white text-[8px] px-2 py-0.5 rounded-full font-bold uppercase">${p.code}</span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-sm truncate">${p.name}</h3>
                            <p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p>
                        </div>
                    </div>`;
            });
        });

        // Helper Functions (Search, Filter, Modal logic - keeping as per your design)
        function search() {
            const val = document.getElementById('search').value.toLowerCase();
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            prods.filter(p => p.name.toLowerCase().includes(val) || p.code.toLowerCase().includes(val)).forEach(p => {
                // (Grid HTML here)
            });
        }
        
        function closeSideMenu() { document.getElementById('sideMenu').classList.add('hidden'); }
        function openAuth() { /* (Login Modal Logic) */ }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        // ... (Remaining functions)
    </script>
</body>
</html>
