<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">Admin Dashboard</h1>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-sm transition">View Shop</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-list-ul text-blue-500"></i> Categories</h3>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="catInput" placeholder="New Category" class="flex-1 p-2 border rounded-lg text-sm outline-blue-500">
                        <button onclick="addCategory()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Add</button>
                    </div>
                    <ul id="catList" class="space-y-2 max-h-60 overflow-y-auto pr-2"></ul>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-plus-circle text-green-500"></i> Upload New Product</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-4">
                            <select id="pCat" class="w-full p-2.5 border rounded-lg bg-gray-50 outline-blue-500"></select>
                            <input type="text" id="pName" placeholder="Product Name" class="w-full p-2.5 border rounded-lg outline-blue-500">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="pCode" placeholder="Item Code" class="w-full p-2.5 border rounded-lg outline-blue-500">
                                <input type="number" id="pPrice" placeholder="Price (Rs.)" class="w-full p-2.5 border rounded-lg outline-blue-500">
                            </div>
                            <textarea id="pDesc" placeholder="Description" rows="3" class="w-full p-2.5 border rounded-lg outline-blue-500"></textarea>
                        </div>
                        <div class="space-y-3">
                            <input type="text" id="img1" placeholder="Main Image URL" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img2" placeholder="Image URL 2" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img3" placeholder="Image URL 3" class="w-full p-2 border rounded-lg text-sm">
                            <button onclick="uploadProduct()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl mt-4">Save Product</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-truck text-orange-500"></i> Manage Orders</h3>
                    <div id="adminOrderList" class="space-y-4">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Standard Functions (Category/Product) - Same as before
        db.ref('categories').on('value', snap => {
            const list = document.getElementById('catList'); const select = document.getElementById('pCat');
            list.innerHTML = ''; select.innerHTML = '';
            snap.forEach(child => {
                const cat = child.val().name;
                list.innerHTML += `<li class="flex justify-between items-center bg-blue-50 p-2 rounded-lg text-sm font-medium text-blue-800">${cat} <button onclick="deleteCat('${child.key}')" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button></li>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        });
        function addCategory() { const name = document.getElementById('catInput').value; if(name) db.ref('categories').push({name}).then(() => document.getElementById('catInput').value = ''); }
        function deleteCat(id) { if(confirm("Delete category?")) db.ref('categories').child(id).remove(); }
        function uploadProduct() {
            const p = { category: document.getElementById('pCat').value, name: document.getElementById('pName').value, code: document.getElementById('pCode').value, price: document.getElementById('pPrice').value, desc: document.getElementById('pDesc').value, images: [document.getElementById('img1').value, document.getElementById('img2').value, document.getElementById('img3').value].filter(u => u !== "") };
            if(!p.name || !p.code || !p.images[0]) return alert("Fill mandatory fields!");
            db.ref('products').push(p).then(() => alert("Product Saved!"));
        }

        // LOAD ORDERS FOR ADMIN
        db.ref('orders').on('value', snap => {
            const list = document.getElementById('adminOrderList');
            list.innerHTML = '';
            snap.forEach(child => {
                const o = child.val();
                list.innerHTML += `
                <div class="p-4 border rounded-xl bg-gray-50 flex flex-col md:flex-row justify-between gap-4">
                    <div class="flex gap-3">
                        <img src="${o.image}" class="w-16 h-16 object-cover rounded-lg">
                        <div>
                            <p class="font-bold text-sm">${o.itemName} (${o.itemCode})</p>
                            <p class="text-xs text-gray-500">User: ${o.userEmail} | Rs. ${o.total}</p>
                            <p class="text-[10px] bg-white border px-2 py-0.5 rounded inline-block mt-1">${o.address}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <select onchange="updateStatus('${child.key}', this.value)" class="text-xs p-2 border rounded-lg bg-white outline-none">
                            <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                            <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                        </select>
                        <button onclick="deleteOrder('${child.key}')" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            });
        });

        function updateStatus(id, status) { db.ref('orders').child(id).update({status}); }
        function deleteOrder(id) { if(confirm("Delete this order record?")) db.ref('orders').child(id).remove(); }
    </script>
</body>
</html>
