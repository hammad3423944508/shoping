<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store | Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; margin: 0 4px; transition: 0.3s; }
        .active-dot { background: #2563eb; width: 20px; border-radius: 10px; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 font-sans selection:bg-blue-100">

    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-2xl font-black italic tracking-tighter text-slate-800">SMART<span class="text-blue-600">SHOP</span></h1>
            <div class="flex items-center gap-4">
                <button onclick="openHistory()" class="relative p-2 text-gray-600">
                    <i class="fa-solid fa-clock-rotate-left text-xl"></i>
                </button>
                <a href="admin.html" class="bg-slate-800 text-white p-2.5 rounded-full w-10 h-10 flex items-center justify-center shadow-lg"><i class="fa-solid fa-user-tie"></i></a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 pb-24">
        <div class="relative mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" oninput="search(this.value)" placeholder="Search products or item codes..." 
                class="w-full bg-white border-none shadow-sm rounded-2xl py-4 pl-12 pr-4 outline-none focus:ring-2 ring-blue-500/20 transition">
        </div>

        <div id="catChips" class="flex gap-3 overflow-x-auto no-scrollbar mb-8 pb-2"></div>

        <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <div id="pModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-[32px] overflow-hidden relative flex flex-col max-h-[95vh] shadow-2xl">
            <button onclick="closeModal('pModal')" class="absolute top-4 right-4 bg-white/90 rounded-full w-10 h-10 z-50 font-bold shadow-lg flex items-center justify-center">×</button>

            <div class="relative p-2 mt-2">
                <div id="pSlider" class="w-full h-72 flex overflow-x-auto snap-x no-scrollbar rounded-2xl bg-gray-50 scroll-smooth"></div>
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-1 pointer-events-none" id="dotsContainer"></div>
                <div class="absolute bottom-6 right-6 bg-green-500 text-white px-4 py-1.5 rounded-full font-black shadow-lg text-lg">
                    Rs. <span id="mPrice"></span>
                </div>
            </div>

            <div class="p-6 overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex-1 pr-2">
                        <h2 id="mName" class="text-xl font-black text-gray-800 leading-tight"></h2>
                        <span id="mCode" class="inline-block mt-1 bg-blue-50 text-blue-600 text-[10px] px-3 py-1 rounded-full font-bold border border-blue-100 uppercase"></span>
                    </div>
                    <button onclick="openOrder()" class="bg-blue-600 text-white px-6 py-3 rounded-[16px] font-bold text-sm shadow-xl shadow-blue-200 shrink-0 active:scale-95 transition">
                        Order Now
                    </button>
                </div>
                
                <p id="mDesc" class="text-gray-500 text-sm mb-6 leading-relaxed"></p>

                <div class="border-t border-gray-100 pt-4 mt-2">
                    <h3 class="text-sm font-black text-gray-800 mb-3 uppercase tracking-wider">Related Items</h3>
                    <div id="relatedProducts" class="flex gap-3 overflow-x-auto no-scrollbar snap-x pb-2"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="oModal" class="fixed inset-0 bg-white hidden z-[70] flex flex-col">
        <div class="p-4 flex items-center border-b">
            <button onclick="closeModal('oModal')" class="p-2"><i class="fa-solid fa-arrow-left text-xl"></i></button>
            <h2 class="flex-1 text-center font-bold">Complete Your Order</h2>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl">
                <img id="oImg" class="w-20 h-20 object-cover rounded-xl shadow-sm">
                <div>
                    <h4 id="oName" class="font-bold text-gray-800"></h4>
                    <p class="text-blue-600 font-black" id="oPriceShow"></p>
                </div>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="custPhone" placeholder="Mobile Number" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-blue-500/20 border-none font-medium">
                <textarea id="custAddress" placeholder="Full Delivery Address" rows="3" class="w-full p-4 bg-gray-50 rounded-2xl outline-none focus:ring-2 ring-blue-500/20 border-none font-medium"></textarea>
            </div>

            <div class="bg-blue-50 p-6 rounded-[24px] border border-blue-100">
                <div class="flex justify-between text-gray-600 mb-2"><span>Item Price:</span> <span id="summPrice"></span></div>
                <div class="flex justify-between text-gray-600 mb-4 pb-4 border-b border-blue-200/50"><span>Delivery Fee:</span> <span>Rs. 150</span></div>
                <div class="flex justify-between items-center"><span class="font-bold text-gray-800">Total Payable:</span> <span class="text-2xl font-black text-blue-600" id="summTotal"></span></div>
            </div>
        </div>
        <div class="p-6 border-t">
            <button onclick="submitOrder()" class="w-full bg-blue-600 text-white py-5 rounded-[20px] font-black text-lg shadow-xl shadow-blue-200 active:scale-95 transition">CONFIRM ORDER</button>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let prods = [];
        let selected = null;

        // Load Products
        db.ref('products').on('value', snap => {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            prods = [];
            snap.forEach(child => {
                const p = child.val();
                p.id = child.key;
                prods.push(p);
                grid.innerHTML += `
                <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer active:scale-95 transition" onclick="view('${p.id}')">
                    <span class="absolute top-3 right-3 bg-black/40 backdrop-blur-md text-white text-[8px] px-2.5 py-1 rounded-full z-10 font-bold uppercase tracking-widest">${p.code}</span>
                    <img src="${p.images[0]}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <h3 class="font-bold text-sm truncate text-gray-800">${p.name}</h3>
                        <p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p>
                    </div>
                </div>`;
            });
            window.prods = prods;
        });

        // Load Categories
        db.ref('categories').on('value', snap => {
            const chips = document.getElementById('catChips');
            chips.innerHTML = '<button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-md">All</button>';
            snap.forEach(child => {
                const name = child.val().name;
                chips.innerHTML += `<button onclick="filterCat('${name}')" class="bg-white text-gray-600 border border-gray-100 px-6 py-2.5 rounded-full text-sm font-bold shadow-sm whitespace-nowrap hover:bg-gray-50 transition">${name}</button>`;
            });
        });

        function view(id) {
            selected = window.prods.find(x => x.id === id);
            document.getElementById('mName').innerText = selected.name;
            document.getElementById('mCode').innerText = selected.code;
            document.getElementById('mDesc').innerText = selected.desc;
            document.getElementById('mPrice').innerText = selected.price;
            
            const s = document.getElementById('pSlider'); s.innerHTML = '';
            const d = document.getElementById('dotsContainer'); d.innerHTML = '';
            selected.images.forEach((img, index) => {
                s.innerHTML += `<div class="w-full flex-shrink-0 snap-center"><img src="${img}" class="w-full h-full object-cover rounded-2xl"></div>`;
                d.innerHTML += `<div class="slider-dot ${index === 0 ? 'active-dot' : ''}"></div>`;
            });
            s.onscroll = () => {
                const idx = Math.round(s.scrollLeft / s.offsetWidth);
                d.querySelectorAll('.slider-dot').forEach((dot, i) => dot.classList.toggle('active-dot', i === idx));
            };

            // Related Products Logic
            const relContainer = document.getElementById('relatedProducts');
            relContainer.innerHTML = '';
            const related = window.prods.filter(p => p.category === selected.category && p.id !== selected.id);
            
            related.forEach(p => {
                relContainer.innerHTML += `
                <div class="min-w-[130px] max-w-[130px] bg-white rounded-2xl border border-gray-100 overflow-hidden cursor-pointer snap-center active:scale-95 transition" onclick="view('${p.id}')">
                    <img src="${p.images[0]}" class="w-full h-24 object-cover">
                    <div class="p-2">
                        <h4 class="text-[10px] font-bold truncate text-gray-700">${p.name}</h4>
                        <p class="text-blue-600 font-black text-[11px] mt-0.5">Rs. ${p.price}</p>
                    </div>
                </div>`;
            });

            document.getElementById('pModal').classList.remove('hidden');
            
            // Push state for back button handling
            history.pushState({ modalOpen: true }, null, "");
        }

        function openOrder() {
            document.getElementById('oImg').src = selected.images[0];
            document.getElementById('oName').innerText = selected.name;
            document.getElementById('oPriceShow').innerText = "Rs. " + selected.price;
            document.getElementById('summPrice').innerText = "Rs. " + selected.price;
            document.getElementById('summTotal').innerText = "Rs. " + (parseInt(selected.price) + 150);
            document.getElementById('oModal').classList.remove('hidden');
            
            history.pushState({ modalOpen: true }, null, "");
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function submitOrder() {
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            if(!phone || !address) return alert("Please provide phone and address!");

            const order = {
                itemCode: selected.code,
                itemName: selected.name,
                itemPrice: selected.price,
                total: parseInt(selected.price) + 150,
                phone, address,
                image: selected.images[0],
                status: 'Pending',
                date: new Date().toLocaleString()
            };

            db.ref('orders').push(order).then(() => {
                alert("Order Placed Successfully!");
                location.reload();
            });
        }

        function filterCat(catName) {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            window.prods.filter(p => p.category === catName).forEach(p => {
                grid.innerHTML += `<div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer" onclick="view('${p.id}')"><span class="absolute top-2 right-2 bg-black/40 text-white text-[8px] px-2 py-0.5 rounded-full z-10 font-bold uppercase">${p.code}</span><img src="${p.images[0]}" class="w-full h-44 object-cover"><div class="p-4"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p></div></div>`;
            });
        }

        function search(val) {
            val = val.toLowerCase();
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            window.prods.filter(p => p.name.toLowerCase().includes(val) || p.code.toLowerCase().includes(val)).forEach(p => {
                grid.innerHTML += `<div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer" onclick="view('${p.id}')"><span class="absolute top-2 right-2 bg-black/40 text-white text-[8px] px-2 py-0.5 rounded-full z-10 font-bold uppercase">${p.code}</span><img src="${p.images[0]}" class="w-full h-44 object-cover"><div class="p-4"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p></div></div>`;
            });
        }

        // Back Button Logic
        window.addEventListener('popstate', function (event) {
            const modals = ['pModal', 'oModal'];
            modals.forEach(id => {
                const modal = document.getElementById(id);
                if (modal && !modal.classList.contains('hidden')) {
                    modal.classList.add('hidden');
                }
            });
        });

        // Exit Warning
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = ''; 
        });
    </script>
</body>
</html>
