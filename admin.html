<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Professional Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        .active-tab { background-color: #2563eb !important; color: white !important; }
        .upload-status { font-size: 11px; font-weight: bold; margin-top: 5px; }
        .preview-box { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; border: 2px dashed #e5e7eb; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">Admin Dashboard</h1>
            <a href="index.html" target="_blank" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-sm transition">View Shop</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="flex space-x-2 mb-8 overflow-x-auto pb-2">
            <button id="btn-uploadTab" onclick="switchTab('uploadTab')" class="tab-btn active-tab bg-white text-gray-600 border px-6 py-3 rounded-xl font-bold text-sm shadow-sm transition">Products</button>
            <button id="btn-slidesTab" onclick="switchTab('slidesTab')" class="tab-btn bg-white text-gray-600 border px-6 py-3 rounded-xl font-bold text-sm shadow-sm transition">Banner Ads</button>
            <button id="btn-ordersTab" onclick="switchTab('ordersTab')" class="tab-btn bg-white text-gray-600 border px-6 py-3 rounded-xl font-bold text-sm shadow-sm transition">Orders <span id="orderBadge" class="bg-red-500 text-white px-2 py-0.5 rounded-full text-[10px]">0</span></button>
        </div>

        <div id="uploadTab" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-gray-700 mb-6 text-lg">Product Management</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <select id="pCat" class="w-full p-3 border rounded-xl bg-gray-50 outline-blue-500"></select>
                        <input type="text" id="pName" placeholder="Product Name" class="w-full p-3 border rounded-xl">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="pCode" placeholder="Code" class="w-full p-3 border rounded-xl">
                            <input type="number" id="pPrice" placeholder="Price" class="w-full p-3 border rounded-xl">
                        </div>
                        <textarea id="pDesc" placeholder="Description" rows="3" class="w-full p-3 border rounded-xl"></textarea>
                    </div>
                    <div class="space-y-3">
                        <input type="text" id="img1" placeholder="Main Image URL" class="w-full p-3 border rounded-xl text-sm">
                        <button onclick="uploadProduct()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700">Save Product</button>
                    </div>
                </div>
            </div>
            <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6"></div>
        </div>

        <div id="slidesTab" class="tab-content hidden space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="font-black text-gray-800 text-xl">Banner Management</h3>
                        <p class="text-xs text-gray-400">Upload photo or paste URL (Maximum 5 Banners)</p>
                    </div>
                    <button onclick="saveBanners()" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold shadow-xl hover:bg-green-700 transition">Save All Banners</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <script>
                        for(let i=1; i<=5; i++) {
                            document.write(`
                                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 space-y-3 relative">
                                    <div class="flex justify-between items-center">
                                        <span class="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Slot ${i}</span>
                                        <button onclick="clearSlot(${i})" class="text-red-400 hover:text-red-600 text-xs font-bold"><i class="fa-solid fa-trash-can"></i> Clear</button>
                                    </div>
                                    
                                    <div class="preview-box">
                                        <img id="prev${i}" src="" class="w-full h-full object-cover hidden">
                                        <div id="placeholder${i}" class="text-gray-300 flex flex-col items-center">
                                            <i class="fa-solid fa-image text-3xl mb-1"></i>
                                            <span class="text-[10px] font-bold">No Image</span>
                                        </div>
                                    </div>

                                    <div class="space-y-2">
                                        <label class="block text-[10px] font-black text-gray-500 uppercase">Option 1: Upload File</label>
                                        <input type="file" accept="image/*" onchange="handleBannerUpload(${i}, this.files[0])" 
                                               class="text-xs block w-full text-gray-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-[10px] file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                                        
                                        <div id="status${i}" class="upload-status text-gray-400">Waiting...</div>

                                        <div class="relative py-2">
                                            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-200"></span></div>
                                            <div class="relative flex justify-center text-[8px] uppercase font-bold"><span class="bg-gray-50 px-2 text-gray-400">OR</span></div>
                                        </div>

                                        <label class="block text-[10px] font-black text-gray-500 uppercase">Option 2: Image URL</label>
                                        <input type="text" id="slide${i}" placeholder="https://image-link.com/photo.jpg" 
                                               oninput="handleBannerUrl(${i}, this.value)"
                                               class="w-full p-2.5 text-xs border rounded-xl outline-blue-500 bg-white">
                                    </div>
                                </div>
                            `);
                        }
                    </script>
                </div>
            </div>
        </div>

        <div id="ordersTab" class="tab-content hidden">
            <div id="ordersList" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById('btn-' + tabId).classList.add('active-tab');
        }

        // --- BANNER FUNCTIONS ---

        // Method 1: Upload via Storage
        function handleBannerUpload(index, file) {
            if(!file) return;
            const statusBox = document.getElementById('status' + index);
            const hiddenInput = document.getElementById('slide' + index);
            const preview = document.getElementById('prev' + index);
            const placeholder = document.getElementById('placeholder' + index);

            statusBox.innerText = "Uploading to Firebase...";
            statusBox.className = "upload-status text-blue-500 animate-pulse";

            const storageRef = storage.ref('banners/slot_' + index + '_' + Date.now());
            const task = storageRef.put(file);

            task.on('state_changed', 
                (snap) => {
                    const progress = (snap.bytesTransferred / snap.totalBytes) * 100;
                    statusBox.innerText = "Progress: " + Math.round(progress) + "%";
                }, 
                (err) => { statusBox.innerText = "Upload Failed!"; statusBox.className="text-red-500"; }, 
                () => {
                    task.snapshot.ref.getDownloadURL().then((url) => {
                        hiddenInput.value = url;
                        preview.src = url;
                        preview.classList.remove('hidden');
                        placeholder.classList.add('hidden');
                        statusBox.innerText = "Uploaded Successfully!";
                        statusBox.className = "upload-status text-green-600";
                    });
                }
            );
        }

        // Method 2: Manual URL Input
        function handleBannerUrl(index, url) {
            const preview = document.getElementById('prev' + index);
            const placeholder = document.getElementById('placeholder' + index);
            const statusBox = document.getElementById('status' + index);

            if(url.trim() !== "") {
                preview.src = url;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                statusBox.innerText = "Using URL Link";
                statusBox.className = "upload-status text-orange-500";
            } else {
                clearSlot(index);
            }
        }

        function clearSlot(index) {
            document.getElementById('slide' + index).value = "";
            document.getElementById('prev' + index).src = "";
            document.getElementById('prev' + index).classList.add('hidden');
            document.getElementById('placeholder' + index).classList.remove('hidden');
            document.getElementById('status' + index).innerText = "Empty";
            document.getElementById('status' + index).className = "upload-status text-gray-400";
        }

        function saveBanners() {
            const bannerData = [];
            for(let i=1; i<=5; i++) {
                const url = document.getElementById('slide' + i).value;
                if(url.trim() !== "") {
                    bannerData.push({ image: url });
                }
            }
            
            if(bannerData.length === 0) {
                if(!confirm("No banners selected. Store will show default. Continue?")) return;
            }

            db.ref('banners').set(bannerData).then(() => {
                alert("Banners Updated Successfully! Check your Index page.");
            }).catch(e => alert("Error: " + e.message));
        }

        // Load Existing Banners on Refresh
        function loadExistingBanners() {
            db.ref('banners').once('value', snap => {
                if(!snap.exists()) return;
                let i = 1;
                snap.forEach(child => {
                    if(i <= 5) {
                        const url = child.val().image;
                        document.getElementById('slide' + i).value = url;
                        const prev = document.getElementById('prev' + i);
                        prev.src = url;
                        prev.classList.remove('hidden');
                        document.getElementById('placeholder' + i).classList.add('hidden');
                        document.getElementById('status' + i).innerText = "Currently Active";
                        document.getElementById('status' + i).className = "upload-status text-green-600";
                        i++;
                    }
                });
            });
        }

        // --- PRODUCT & ORDER FUNCTIONS (Existing Logic) ---
        // Categories Load
        db.ref('categories').on('value', snap => {
            const select = document.getElementById('pCat'); select.innerHTML = '';
            snap.forEach(child => {
                select.innerHTML += `<option value="${child.val().name}">${child.val().name}</option>`;
            });
        });

        function uploadProduct() {
            const p = {
                category: document.getElementById('pCat').value,
                name: document.getElementById('pName').value,
                code: document.getElementById('pCode').value,
                price: document.getElementById('pPrice').value,
                desc: document.getElementById('pDesc').value,
                images: [document.getElementById('img1').value]
            };
            if(!p.name || !p.price) return alert("Fill Name & Price");
            db.ref('products').push(p).then(() => {
                alert("Product Added!");
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
            });
        }

        db.ref('products').on('value', snap => {
            const list = document.getElementById('productList'); list.innerHTML = '';
            snap.forEach(child => {
                const p = child.val();
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border flex gap-4 items-center">
                        <img src="${p.images[0]}" class="w-16 h-16 object-cover rounded-lg">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm">${p.name}</h4>
                            <p class="text-blue-600 font-bold text-xs">Rs. ${p.price}</p>
                        </div>
                        <button onclick="deleteProd('${child.key}')" class="text-red-500 p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
            });
        });

        function deleteProd(id) { if(confirm("Delete product?")) db.ref('products').child(id).remove(); }

        db.ref('orders').on('value', snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = '';
            let count = 0;
            snap.forEach(child => {
                count++; const o = child.val();
                list.innerHTML = `
                    <div class="p-4 bg-white border rounded-2xl shadow-sm flex justify-between items-center">
                        <div class="flex gap-4">
                            <img src="${o.image}" class="w-12 h-12 rounded-lg object-cover">
                            <div><h4 class="font-bold">${o.itemName}</h4><p class="text-xs text-gray-500">${o.customerName} - ${o.phone}</p></div>
                        </div>
                        <span class="text-xs font-bold px-3 py-1 bg-orange-100 text-orange-600 rounded-full">${o.status}</span>
                    </div>` + list.innerHTML;
            });
            document.getElementById('orderBadge').innerText = count;
        });

        // Initialize
        loadExistingBanners();
    </script>
</body>
</html>
