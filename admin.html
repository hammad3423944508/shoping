<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Professional Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .upload-status { font-size: 10px; font-weight: bold; margin-top: 4px; }
        .active-tab { background-color: #2563eb !important; color: white !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">Admin Dashboard</h1>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-sm transition">View Shop</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 sticky top-24">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-blue-500"></i> Categories
                    </h3>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="catInput" placeholder="New Category" class="flex-1 p-2 border rounded-lg text-sm outline-blue-500">
                        <button onclick="addCategory()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Add</button>
                    </div>
                    <ul id="catList" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2"></ul>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
                    <button id="btn-uploadTab" onclick="switchTab('uploadTab')" class="tab-btn active-tab bg-white text-gray-600 border px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition whitespace-nowrap">Upload / Edit</button>
                    <button id="btn-itemsTab" onclick="switchTab('itemsTab')" class="tab-btn bg-white text-gray-600 border px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition whitespace-nowrap">Inventory</button>
                    <button id="btn-ordersTab" onclick="switchTab('ordersTab')" class="tab-btn bg-white text-gray-600 border px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition whitespace-nowrap">Orders</button>
                    <button id="btn-slidesTab" onclick="switchTab('slidesTab')" class="tab-btn bg-white text-gray-600 border px-5 py-2.5 rounded-xl font-bold text-sm shadow-sm transition whitespace-nowrap">SlideAds</button>
                </div>

                <div id="uploadTab" class="tab-content space-y-6">
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-700 mb-6 text-lg" id="formTitle">Upload New Product</h3>
                        <input type="hidden" id="editKey">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-4">
                                <select id="pCat" class="w-full p-3 border rounded-xl bg-gray-50 outline-blue-500"></select>
                                <input type="text" id="pName" placeholder="Product Name" class="w-full p-3 border rounded-xl">
                                <div class="grid grid-cols-2 gap-3">
                                    <input type="text" id="pCode" placeholder="Code" class="w-full p-3 border rounded-xl">
                                    <input type="number" id="pPrice" placeholder="Price" class="w-full p-3 border rounded-xl">
                                </div>
                                <textarea id="pDesc" placeholder="Description" rows="4" class="w-full p-3 border rounded-xl"></textarea>
                            </div>
                            <div class="space-y-3 bg-gray-50 p-4 rounded-xl">
                                <input type="text" id="img1" placeholder="Image URL 1" class="w-full p-3 border rounded-xl text-sm">
                                <input type="text" id="img2" placeholder="Image URL 2" class="w-full p-3 border rounded-xl text-sm">
                                <input type="text" id="img3" placeholder="Image URL 3" class="w-full p-3 border rounded-xl text-sm">
                                <button onclick="uploadProduct()" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg">Save Product</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="itemsTab" class="tab-content hidden"><div id="productList" class="space-y-2"></div></div>

                <div id="ordersTab" class="tab-content hidden">
                    <div class="bg-white p-6 rounded-2xl border"><div id="ordersList" class="space-y-4"></div></div>
                </div>

                <div id="slidesTab" class="tab-content hidden space-y-6">
                    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
                        <h3 class="font-bold text-gray-700 mb-4 text-lg">Banner Ad Management</h3>
                        <p class="text-xs text-blue-500 mb-6 bg-blue-50 p-3 rounded-lg border border-blue-100 italic">
                            Computer/Mobile se photo select karein, upload hone ka intezar karein, phir "Update Banners" dabayein.
                        </p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="bannerUploadContainer">
                            <script>
                                for(let i=1; i<=5; i++) {
                                    document.write(`
                                        <div class="p-4 border border-gray-200 rounded-2xl bg-gray-50">
                                            <label class="text-[10px] font-black text-gray-400 uppercase">Banner Slot ${i}</label>
                                            <div class="mt-2 flex items-center gap-3">
                                                <div class="w-20 h-12 bg-gray-200 rounded-lg overflow-hidden shrink-0 border border-gray-300">
                                                    <img id="prev${i}" src="" class="w-full h-full object-cover hidden">
                                                </div>
                                                <input type="file" accept="image/*" onchange="handleBannerUpload(${i}, this.files[0])" class="text-xs block w-full">
                                            </div>
                                            <input type="hidden" id="slide${i}">
                                            <div id="status${i}" class="upload-status text-gray-400">Not Uploaded</div>
                                        </div>
                                    `);
                                }
                            </script>
                        </div>
                        <button onclick="saveBanners()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg transition mt-8 text-lg">Update Banners</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById('btn-' + tabId).classList.add('active-tab');
        }

        // --- BANNER UPLOAD LOGIC ---
        function handleBannerUpload(index, file) {
            if(!file) return;
            const statusBox = document.getElementById('status' + index);
            const hiddenInput = document.getElementById('slide' + index);
            const preview = document.getElementById('prev' + index);

            statusBox.innerText = "Uploading...";
            statusBox.className = "upload-status text-blue-500 animate-pulse";

            const storageRef = storage.ref('banners/img_' + index + '_' + Date.now());
            const task = storageRef.put(file);

            task.on('state_changed', 
                (snap) => { /* Progress */ }, 
                (err) => { statusBox.innerText = "Error!"; }, 
                () => {
                    task.snapshot.ref.getDownloadURL().then((url) => {
                        hiddenInput.value = url;
                        preview.src = url;
                        preview.classList.remove('hidden');
                        statusBox.innerText = "Ready to Update!";
                        statusBox.className = "upload-status text-green-600";
                    });
                }
            );
        }

        function saveBanners() {
            const bannerUrls = [];
            for(let i=1; i<=5; i++) {
                const url = document.getElementById('slide' + i).value;
                if(url) bannerUrls.push({ image: url });
            }
            if(bannerUrls.length === 0) return alert("Kam az kam 1 image select karein!");
            db.ref('banners').set(bannerUrls).then(() => alert("Banners Updated!"));
        }

        // LOAD CURRENT BANNERS
        db.ref('banners').once('value', snap => {
            let i = 1;
            snap.forEach(child => {
                if(i <= 5) {
                    const url = child.val().image;
                    document.getElementById('slide' + i).value = url;
                    const prev = document.getElementById('prev' + i);
                    prev.src = url; prev.classList.remove('hidden');
                    document.getElementById('status' + i).innerText = "Current Active";
                    i++;
                }
            });
        });

        // Other Functions (Categories, Products)
        db.ref('categories').on('value', snap => {
            const list = document.getElementById('catList'); const select = document.getElementById('pCat');
            list.innerHTML = ''; select.innerHTML = '';
            snap.forEach(child => {
                const cat = child.val().name;
                list.innerHTML += `<li class="flex justify-between items-center bg-blue-50 p-3 rounded-xl text-sm font-bold text-blue-800 mb-2">${cat} <button onclick="deleteCat('${child.key}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></li>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        });

        function addCategory() {
            const val = document.getElementById('catInput').value;
            if(val) db.ref('categories').push({name: val}).then(() => document.getElementById('catInput').value = '');
        }

        function deleteCat(id) { if(confirm("Delete?")) db.ref('categories').child(id).remove(); }

        function uploadProduct() {
            const p = {
                category: document.getElementById('pCat').value,
                name: document.getElementById('pName').value,
                code: document.getElementById('pCode').value,
                price: document.getElementById('pPrice').value,
                desc: document.getElementById('pDesc').value,
                images: [document.getElementById('img1').value].filter(u => u !== "")
            };
            db.ref('products').push(p).then(() => alert("Product Added!"));
        }

        db.ref('products').on('value', snap => {
            const list = document.getElementById('productList'); list.innerHTML = '';
            snap.forEach(child => {
                const p = child.val();
                list.innerHTML += `<div class="p-3 bg-white border rounded-xl flex justify-between items-center mb-2"><span>${p.name} (${p.code})</span><button onclick="deleteProd('${child.key}')" class="text-red-500"><i class="fa-solid fa-trash"></i></button></div>`;
            });
        });

        function deleteProd(id) { if(confirm("Delete?")) db.ref('products').child(id).remove(); }

        db.ref('orders').on('value', snap => {
            const list = document.getElementById('ordersList'); list.innerHTML = '';
            snap.forEach(child => {
                const o = child.val();
                list.innerHTML = `<div class="p-4 border rounded-xl flex gap-3"><div><h4 class="font-bold">${o.itemName}</h4><p class="text-xs">${o.customerName} - ${o.phone}</p></div></div>` + list.innerHTML;
            });
        });
    </script>
</body>
</html>
