<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic flex items-center gap-2">
                <i class="fa-solid fa-user-shield text-blue-400"></i> Admin Dashboard
            </h1>
            <div class="flex gap-4">
                <a href="index.html" target="_blank" class="bg-blue-600 hover:bg-blue-700 px-4 py-1.5 rounded-lg text-sm transition font-bold">View Shop</a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-blue-500"></i> Categories
                    </h3>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="catInput" placeholder="New Category" class="flex-1 p-2 border rounded-lg text-sm outline-blue-500">
                        <button onclick="addCategory()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Add</button>
                    </div>
                    <ul id="catList" class="space-y-2 max-h-60 overflow-y-auto pr-2">
                        </ul>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-green-500"></i> Upload New Product
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-4">
                            <select id="pCat" class="w-full p-2.5 border rounded-lg bg-gray-50 outline-blue-500"></select>
                            <input type="text" id="pName" placeholder="Product Name" class="w-full p-2.5 border rounded-lg outline-blue-500">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="pCode" placeholder="Item Code" class="w-full p-2.5 border rounded-lg outline-blue-500">
                                <input type="number" id="pPrice" placeholder="Price (Rs.)" class="w-full p-2.5 border rounded-lg outline-blue-500">
                            </div>
                            <textarea id="pDesc" placeholder="Description" rows="3" class="w-full p-2.5 border rounded-lg outline-blue-500"></textarea>
                        </div>
                        <div class="space-y-3">
                            <input type="text" id="img1" placeholder="Main Image URL" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img2" placeholder="Image URL 2" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img3" placeholder="Image URL 3" class="w-full p-2 border rounded-lg text-sm">
                            <button onclick="uploadProduct()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl mt-4 transition shadow-lg">Save Product</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-6 flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-truck text-orange-500"></i> Customer Orders</span>
                        <span id="orderCount" class="bg-orange-100 text-orange-600 text-xs px-3 py-1 rounded-full">0 Orders</span>
                    </h3>
                    <div id="adminOrderList" class="space-y-6">
                        </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- CATEGORY FUNCTIONS ---
        db.ref('categories').on('value', snap => {
            const list = document.getElementById('catList'); 
            const select = document.getElementById('pCat');
            list.innerHTML = ''; select.innerHTML = '';
            snap.forEach(child => {
                const cat = child.val().name;
                list.innerHTML += `
                <li class="flex justify-between items-center bg-blue-50 p-2.5 rounded-lg text-sm font-medium text-blue-800 border border-blue-100">
                    ${cat} 
                    <button onclick="deleteCat('${child.key}')" class="text-red-400 hover:text-red-600 transition"><i class="fa-solid fa-trash-can"></i></button>
                </li>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        });

        function addCategory() { 
            const name = document.getElementById('catInput').value; 
            if(name) db.ref('categories').push({name}).then(() => document.getElementById('catInput').value = ''); 
        }

        function deleteCat(id) { 
            if(confirm("Delete this category?")) db.ref('categories').child(id).remove(); 
        }

        // --- PRODUCT UPLOAD ---
        function uploadProduct() {
            const p = { 
                category: document.getElementById('pCat').value, 
                name: document.getElementById('pName').value, 
                code: document.getElementById('pCode').value, 
                price: document.getElementById('pPrice').value, 
                desc: document.getElementById('pDesc').value, 
                images: [
                    document.getElementById('img1').value, 
                    document.getElementById('img2').value, 
                    document.getElementById('img3').value
                ].filter(u => u !== "") 
            };
            if(!p.name || !p.code || !p.images[0]) return alert("Please fill Name, Code, and at least one Image!");
            db.ref('products').push(p).then(() => {
                alert("Product Saved Successfully!");
                document.getElementById('pName').value = '';
                document.getElementById('pCode').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pDesc').value = '';
            });
        }

        // --- UPDATED ORDER MANAGEMENT (ALL DETAILS) ---
        db.ref('orders').on('value', snap => {
            const list = document.getElementById('adminOrderList');
            const count = document.getElementById('orderCount');
            list.innerHTML = '';
            let totalOrders = 0;

            if(!snap.exists()) {
                list.innerHTML = `<p class="text-center text-gray-400 py-10">No orders placed yet.</p>`;
                count.innerText = "0 Orders";
                return;
            }

            snap.forEach(child => {
                totalOrders++;
                const o = child.val();
                const orderId = child.key;

                list.innerHTML += `
                <div class="p-5 border border-gray-200 rounded-2xl bg-gray-50/50 shadow-sm relative group overflow-hidden">
                    <div class="flex flex-col md:flex-row gap-6">
                        <div class="w-full md:w-32">
                            <img src="${o.image}" class="w-full h-32 object-cover rounded-xl shadow-inner bg-white">
                            <a href="${o.image}" target="_blank" class="mt-2 block text-center text-[10px] font-bold text-blue-600 bg-blue-50 py-1 rounded-md border border-blue-100 uppercase">
                                <i class="fa-solid fa-link"></i> Direct Link
                            </a>
                        </div>

                        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <h4 class="text-lg font-black text-gray-800 leading-tight">${o.itemName}</h4>
                                <p class="text-xs text-blue-600 font-bold tracking-widest uppercase mb-2">CODE: ${o.itemCode}</p>
                                <div class="space-y-1 text-sm">
                                    <p class="text-gray-600 flex items-center gap-2"><i class="fa-solid fa-user text-xs"></i> <b>User:</b> ${o.userEmail}</p>
                                    <p class="text-gray-600 flex items-center gap-2"><i class="fa-solid fa-phone text-xs"></i> <b>Phone:</b> ${o.phone}</p>
                                    <p class="text-gray-600 flex items-center gap-2"><i class="fa-solid fa-location-dot text-xs"></i> <b>Address:</b> ${o.address}</p>
                                </div>
                            </div>

                            <div class="bg-white p-4 rounded-xl border border-gray-100">
                                <div class="flex justify-between text-xs text-gray-500 mb-1"><span>Item Price:</span> <span>Rs. ${o.itemPrice}</span></div>
                                <div class="flex justify-between text-xs text-gray-500 mb-1"><span>Delivery:</span> <span>Rs. 150</span></div>
                                <div class="flex justify-between text-base font-black text-gray-900 border-t pt-2 mt-2">
                                    <span>Total Bill:</span> <span>Rs. ${o.total}</span>
                                </div>
                                <div class="mt-4 flex flex-wrap gap-2 items-center">
                                    <span class="text-[10px] font-bold text-gray-400 uppercase"><i class="fa-regular fa-calendar"></i> ${o.date}</span>
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col justify-between items-end gap-4 min-w-[120px]">
                            <select onchange="updateStatus('${orderId}', this.value)" class="w-full text-xs font-bold p-2.5 border rounded-lg bg-white outline-none shadow-sm cursor-pointer ${o.status === 'Delivered' ? 'text-green-600 border-green-200' : 'text-orange-600 border-orange-200'}">
                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                            <button onclick="deleteOrder('${orderId}')" class="text-gray-300 hover:text-red-500 transition-colors p-2" title="Delete Order Record">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            });
            count.innerText = `${totalOrders} Orders`;
        });

        function updateStatus(id, status) { 
            db.ref('orders').child(id).update({status}).then(() => {
                console.log("Status Updated to: " + status);
            }); 
        }

        function deleteOrder(id) { 
            if(confirm("Are you sure you want to remove this order from database?")) {
                db.ref('orders').child(id).remove(); 
            }
        }
    </script>
</body>
</html>
