<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Professional Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">Admin Dashboard</h1>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded text-sm transition">View Shop</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-blue-500"></i> Categories
                    </h3>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="catInput" placeholder="New Category" class="flex-1 p-2 border rounded-lg text-sm outline-blue-500">
                        <button onclick="addCategory()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold">Add</button>
                    </div>
                    <ul id="catList" class="space-y-2 max-h-60 overflow-y-auto pr-2"></ul>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-green-500"></i> <span id="formTitle">Upload New Product</span>
                    </h3>
                    
                    <input type="hidden" id="editKey"> <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs font-bold text-gray-500 uppercase">Category</label>
                                <select id="pCat" class="w-full p-2.5 border rounded-lg bg-gray-50 outline-blue-500"></select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-500 uppercase">Product Name</label>
                                <input type="text" id="pName" class="w-full p-2.5 border rounded-lg outline-blue-500">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase">Item Code</label>
                                    <input type="text" id="pCode" class="w-full p-2.5 border rounded-lg outline-blue-500">
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase">Price (Rs.)</label>
                                    <input type="number" id="pPrice" class="w-full p-2.5 border rounded-lg outline-blue-500">
                                </div>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-500 uppercase">Description</label>
                                <textarea id="pDesc" rows="3" class="w-full p-2.5 border rounded-lg outline-blue-500"></textarea>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="text-xs font-bold text-gray-500 uppercase">Image URLs (Up to 4)</label>
                            <input type="text" id="img1" placeholder="Main Image URL" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img2" placeholder="Image URL 2" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img3" placeholder="Image URL 3" class="w-full p-2 border rounded-lg text-sm">
                            <input type="text" id="img4" placeholder="Image URL 4" class="w-full p-2 border rounded-lg text-sm">
                            
                            <button id="saveBtn" onclick="uploadProduct()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg transition mt-4">
                                Save Product
                            </button>
                            <button id="cancelEditBtn" onclick="resetForm()" class="w-full bg-gray-400 text-white font-bold py-2 rounded-xl hidden">
                                Cancel Edit
                            </button>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked text-blue-500"></i> Items
                    </h3>
                    <div id="productList" class="grid grid-cols-1 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load Categories
        db.ref('categories').on('value', snap => {
            const list = document.getElementById('catList');
            const select = document.getElementById('pCat');
            list.innerHTML = ''; select.innerHTML = '';
            snap.forEach(child => {
                const cat = child.val().name;
                list.innerHTML += `<li class="flex justify-between items-center bg-blue-50 p-2 rounded-lg text-sm font-medium text-blue-800">
                    ${cat} <button onclick="deleteCat('${child.key}')" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                </li>`;
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        });

        function addCategory() {
            const name = document.getElementById('catInput').value;
            if(name) db.ref('categories').push({name}).then(() => document.getElementById('catInput').value = '');
        }

        function deleteCat(id) { if(confirm("Are you sure?")) db.ref('categories').child(id).remove(); }

        function uploadProduct() {
            const key = document.getElementById('editKey').value;
            const p = {
                category: document.getElementById('pCat').value,
                name: document.getElementById('pName').value,
                code: document.getElementById('pCode').value,
                price: document.getElementById('pPrice').value,
                desc: document.getElementById('pDesc').value,
                images: [
                    document.getElementById('img1').value,
                    document.getElementById('img2').value,
                    document.getElementById('img3').value,
                    document.getElementById('img4').value
                ].filter(u => u !== "")
            };
            
            if(!p.name || !p.code || !p.images[0]) return alert("Please fill mandatory fields!");

            if(key) {
                // Update existing
                db.ref('products').child(key).update(p).then(() => {
                    alert("Product Updated!");
                    resetForm();
                });
            } else {
                // Add new
                db.ref('products').push(p).then(() => {
                    alert("Product Saved!");
                    resetForm();
                });
            }
        }

        // Updated Inventory List with Picture, Code, Name, Price and Icons
        db.ref('products').on('value', snap => {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            snap.forEach(child => {
                const p = child.val();
                list.innerHTML += `
                <div class="flex flex-wrap items-center gap-4 p-4 border rounded-2xl bg-gray-50 shadow-sm">
                    <img src="${p.images[0]}" class="w-20 h-20 object-cover rounded-xl border">
                    <div class="flex-1 min-w-[150px]">
                        <p class="text-[10px] font-black text-blue-600 uppercase tracking-wider">${p.code}</p>
                        <h4 class="font-bold text-gray-800">${p.name}</h4>
                        <p class="text-green-600 font-black">Rs. ${p.price}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="editProd('${child.key}')" class="bg-blue-100 text-blue-600 p-2.5 rounded-full hover:bg-blue-200 transition" title="Edit">
                            <i class="fa-solid fa-pencil"></i>
                        </button>
                        <button onclick="deleteProd('${child.key}')" class="bg-red-100 text-red-500 p-2.5 rounded-full hover:bg-red-200 transition" title="Delete">
                            <i class="fa-solid fa-recycle"></i>
                        </button>
                        <button onclick="shareProd('${p.name}', '${p.code}')" class="bg-gray-100 text-gray-600 p-2.5 rounded-full hover:bg-gray-200 transition" title="Share">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                </div>`;
            });
        });

        function editProd(key) {
            db.ref('products').child(key).once('value', snap => {
                const p = snap.val();
                document.getElementById('editKey').value = key;
                document.getElementById('pCat').value = p.category;
                document.getElementById('pName').value = p.name;
                document.getElementById('pCode').value = p.code;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pDesc').value = p.desc;
                document.getElementById('img1').value = p.images[0] || '';
                document.getElementById('img2').value = p.images[1] || '';
                document.getElementById('img3').value = p.images[2] || '';
                document.getElementById('img4').value = p.images[3] || '';
                
                document.getElementById('formTitle').innerText = "Edit Product";
                document.getElementById('saveBtn').innerText = "Update Product";
                document.getElementById('saveBtn').classList.replace('bg-green-600', 'bg-blue-600');
                document.getElementById('cancelEditBtn').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function resetForm() {
            document.getElementById('editKey').value = '';
            document.getElementById('pName').value = '';
            document.getElementById('pCode').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('img1').value = '';
            document.getElementById('img2').value = '';
            document.getElementById('img3').value = '';
            document.getElementById('img4').value = '';
            document.getElementById('formTitle').innerText = "Upload New Product";
            document.getElementById('saveBtn').innerText = "Save Product";
            document.getElementById('saveBtn').classList.replace('bg-blue-600', 'bg-green-600');
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function deleteProd(id) { if(confirm("Delete this product?")) db.ref('products').child(id).remove(); }

        function shareProd(name, code) {
            const text = `Check out this product: ${name} (Code: ${code})`;
            if (navigator.share) {
                navigator.share({ title: name, text: text, url: window.location.origin + '/index.html' });
            } else {
                alert("Sharing not supported on this browser. Copying to clipboard...");
                navigator.clipboard.writeText(text);
            }
        }
    </script>
</body>
</html>
