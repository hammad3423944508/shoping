<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store | Online Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; margin: 0 4px; transition: 0.3s; }
        .active-dot { background: #2563eb; width: 20px; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900">

    <nav class="bg-white shadow-sm sticky top-0 z-50 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="document.getElementById('sideMenu').classList.remove('hidden')" class="text-xl text-gray-700 hover:text-blue-600 focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1 class="text-2xl font-black text-blue-600 tracking-tighter">STORE</h1>
            </div>
            <div id="userTools" class="flex items-center gap-3">
                <button onclick="openAuth()" id="loginBtn" class="bg-blue-600 text-white px-5 py-1.5 rounded-full text-sm font-bold shadow-md shadow-blue-200">Login</button>
                <div id="userInfo" class="hidden flex items-center gap-3">
                    <button onclick="openOrders()" class="text-blue-600 text-xs font-bold flex items-center gap-1">
                        <i class="fa-solid fa-box-open"></i> My Orders
                    </button>
                    <button onclick="logout()" class="text-red-500 text-xs font-bold bg-red-50 p-2 rounded-lg">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="sideMenu" class="fixed inset-0 bg-black/60 hidden z-[100] transition-opacity flex">
        <div class="w-64 bg-white h-full shadow-2xl flex flex-col z-[101]">
            <div class="p-5 bg-blue-600 text-white flex justify-between items-center">
                <h2 class="font-bold text-lg">Menu</h2>
                <button onclick="closeSideMenu()" class="text-2xl leading-none">&times;</button>
            </div>
            <div class="flex flex-col p-3 space-y-2 mt-2">
                <button onclick="closeSideMenu(); document.getElementById('catSlider').scrollIntoView({behavior: 'smooth'});" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-layer-group w-5 text-blue-500"></i> Category</button>
                <button onclick="closeSideMenu(); openOrders();" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-box-open w-5 text-blue-500"></i> My Orders</button>
                <button onclick="closeSideMenu(); openOrders();" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-truck-fast w-5 text-blue-500"></i> Order Status</button>
                <button onclick="closeSideMenu(); alert('Cash on Delivery is available for all items. We also accept bank transfers.');" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-credit-card w-5 text-blue-500"></i> Payment Method</button>
                <button onclick="closeSideMenu(); alert('WhatsApp us at: +923423944508');" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-phone w-5 text-blue-500"></i> Contact us</button>
                <button onclick="closeSideMenu(); alert('Need help? Our customer support is available 24/7 on WhatsApp.');" class="text-left p-3 hover:bg-blue-50 rounded-xl font-semibold text-sm flex items-center gap-3 text-gray-700"><i class="fa-solid fa-circle-info w-5 text-blue-500"></i> Help</button>
            </div>
        </div>
        <div class="flex-1" onclick="closeSideMenu()"></div> 
    </div>

    <div class="max-w-6xl mx-auto p-4">
        
        <div class="relative mb-6">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
            <input type="text" id="search" autocomplete="new-password" placeholder="Search product name or code..." onkeyup="search()" class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm outline-blue-500 bg-white">
        </div>

        <div id="catSlider" class="flex gap-3 overflow-x-auto no-scrollbar snap-x mb-6 pb-2"></div>

        <div class="relative w-full h-36 md:h-64 mb-8 overflow-hidden rounded-2xl shadow-sm bg-white" id="bannerContainer">
            <div id="bannerSlider" class="flex transition-transform duration-700 ease-in-out h-full w-full">
                </div>
        </div>

        <div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </div>

    <div id="pModal" class="fixed inset-0 bg-black/80 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-[32px] overflow-hidden relative flex flex-col max-h-[95vh] shadow-2xl">
            <button onclick="closeModal('pModal')" class="absolute top-4 right-4 bg-white/90 rounded-full w-10 h-10 z-50 font-bold shadow-lg flex items-center justify-center">×</button>
            <div class="relative p-2 mt-2">
                <div id="pSlider" class="w-full h-80 flex overflow-x-auto snap-x no-scrollbar rounded-2xl bg-gray-50 scroll-smooth"></div>
                <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-1 pointer-events-none" id="dotsContainer"></div>
                <div class="absolute bottom-6 right-6 bg-green-500 text-white px-4 py-1.5 rounded-full font-black shadow-lg text-lg">
                    Rs. <span id="mPrice"></span>
                </div>
            </div>
            <div class="p-6 overflow-y-auto">
                <div class="flex justify-between items-start mb-3 gap-2">
                    <div class="flex-1">
                        <h2 id="mName" class="text-2xl font-black text-gray-800 leading-tight"></h2>
                        <span id="mCode" class="bg-blue-50 text-blue-600 text-[10px] px-3 py-1 rounded-full font-bold border border-blue-100 uppercase mt-2 inline-block"></span>
                    </div>
                    <button onclick="openOrder()" class="bg-blue-600 text-white px-5 py-3 rounded-2xl font-bold text-sm shadow-xl shadow-blue-200 shrink-0 hover:bg-blue-700 transition">Order Now</button>
                </div>
                <p id="mDesc" class="text-gray-500 text-sm mb-6 leading-relaxed"></p>
                <div id="similarSection" class="hidden border-t border-gray-100 pt-4 mt-2">
                    <h4 class="text-xs font-black text-gray-400 uppercase tracking-wider mb-3">More in this category</h4>
                    <div id="mSimilar" class="flex gap-3 overflow-x-auto no-scrollbar snap-x pb-2"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="oModal" class="fixed inset-0 bg-black/80 hidden z-[70] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-2xl max-h-[90vh] overflow-y-auto no-scrollbar">
            <div id="step1">
                <h3 class="text-2xl font-black mb-6 flex items-center gap-2"><i class="fa-solid fa-truck-fast text-blue-600"></i> Delivery Info</h3>
                <div class="space-y-3">
                    <select id="uSize" class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-blue-500 hidden font-semibold text-gray-700">
                        <option value="" disabled selected>Select Size</option>
                        <option value="Small">Small</option><option value="Medium">Medium</option><option value="Large">Large</option><option value="E-Large">E-Large</option>
                    </select>
                    <input type="text" id="uName" placeholder="Full Name" class="w-full p-3.5 bg-gray-50 border-none rounded-2xl outline-blue-500 text-sm">
                    <input type="tel" id="uPhone" placeholder="Mobile Number" class="w-full p-3.5 bg-gray-50 border-none rounded-2xl outline-blue-500 text-sm">
                    <div class="flex gap-2">
                        <input type="text" id="uCity" placeholder="City" class="w-1/2 p-3.5 bg-gray-50 border-none rounded-2xl outline-blue-500 text-sm">
                        <input type="text" id="uSector" placeholder="Sector/Area" class="w-1/2 p-3.5 bg-gray-50 border-none rounded-2xl outline-blue-500 text-sm">
                    </div>
                    <div class="relative">
                        <textarea id="uAddr" placeholder="Full Address" class="w-full p-3.5 pr-14 bg-gray-50 border-none rounded-2xl outline-blue-500 text-sm" rows="3"></textarea>
                        <button onclick="getPinLocation()" class="absolute top-3 right-3 bg-blue-100 text-blue-600 p-2 rounded-xl text-xs font-black shadow-sm" title="Auto-fill Location"><i class="fa-solid fa-location-dot"></i></button>
                    </div>
                    <input type="text" id="uLandmark" placeholder="Mashhoor Jagah (Optional)" class="w-full p-3.5 bg-gray-50 border-none rounded-2xl outline-blue-500 text-sm">
                </div>
                <button onclick="goConfirm()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold mt-6 shadow-lg shadow-blue-200">Confirm Details</button>
                <button onclick="closeModal('oModal')" class="w-full mt-4 text-gray-400 text-sm font-bold">Cancel</button>
            </div>
            <div id="step2" class="hidden">
                <h3 class="text-2xl font-black mb-6 text-center">Final Summary</h3>
                <div class="bg-slate-50 p-6 rounded-3xl mb-8 space-y-4 text-sm">
                    <div class="flex justify-between"><span>Price:</span> <span id="fPrice" class="font-bold"></span></div>
                    <div class="flex justify-between text-blue-600"><span>Delivery:</span> <span class="font-bold">Rs. 150</span></div>
                    <div class="border-t border-dashed pt-4 flex justify-between text-lg font-black"><span>Total:</span> <span id="fTotal" class="text-blue-700"></span></div>
                </div>
                <button onclick="processOrder()" class="w-full bg-green-500 text-white py-5 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-xl">
                    <i class="fa-brands fa-whatsapp text-2xl"></i> Send to WhatsApp
                </button>
                <button onclick="document.getElementById('step2').classList.add('hidden'); document.getElementById('step1').classList.remove('hidden');" class="w-full mt-4 text-gray-400 text-sm font-bold">Back to Edit</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-black/80 hidden z-[110] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[32px] p-6 max-h-[80vh] overflow-y-auto relative">
            <button onclick="closeModal('historyModal')" class="absolute top-4 right-4 text-2xl font-bold text-gray-400">×</button>
            <h2 class="text-2xl font-black mb-6">My Orders</h2>
            <div id="myOrderList" class="space-y-4"></div>
        </div>
    </div>

    <div id="aModal" class="fixed inset-0 bg-black/80 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-8">
            <h2 class="text-2xl font-black mb-6 text-center">User Portal</h2>
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-gray-50 rounded-2xl mb-3 border-none outline-blue-500">
            <input type="password" id="pass" placeholder="Password" class="w-full p-4 bg-gray-50 rounded-2xl mb-4 border-none outline-blue-500">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold mb-2">Login</button>
            <button onclick="register()" class="w-full bg-gray-100 text-gray-700 py-4 rounded-2xl font-bold">Register</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQ0Ckzlgy8GV-uP89ypRHwrMX2Wq-2Mok",
            authDomain: "onlineshoping-bcf3b.firebaseapp.com",
            databaseURL: "https://onlineshoping-bcf3b-default-rtdb.firebaseio.com/",
            projectId: "onlineshoping-bcf3b",
            storageBucket: "onlineshoping-bcf3b.firebasestorage.app",
            messagingSenderId: "634849561995",
            appId: "1:634849561995:web:caa5e8916b5489e1f4f38e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let selected = null;
        let currentUser = null;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            if(user) {
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                closeModal('aModal');
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
            }
        });

        // BANNER SYSTEM
        let currentBannerIndex = 0;
        let bannerCount = 0;
        let bannerInterval;

        db.ref('banners').on('value', snap => {
            const slider = document.getElementById('bannerSlider');
            slider.innerHTML = '';
            bannerCount = 0;
            if (snap.exists()) {
                snap.forEach(child => {
                    slider.innerHTML += `<img src="${child.val().image}" class="w-full h-full object-cover flex-shrink-0">`;
                    bannerCount++;
                });
            } else {
                slider.innerHTML += `<div class="w-full h-full flex-shrink-0 bg-blue-100 flex items-center justify-center text-blue-500 font-bold text-xl">No Banners Available</div>`;
                bannerCount = 1;
            }
            startBannerAutoScroll();
        });

        function startBannerAutoScroll() {
            clearInterval(bannerInterval);
            if (bannerCount <= 1) return;
            bannerInterval = setInterval(() => {
                currentBannerIndex = (currentBannerIndex + 1) % bannerCount;
                document.getElementById('bannerSlider').style.transform = `translateX(-${currentBannerIndex * 100}%)`;
            }, 4000);
        }

        // LOAD CATEGORIES
        db.ref('categories').on('value', snap => {
            const div = document.getElementById('catSlider'); div.innerHTML = '';
            snap.forEach(child => {
                div.innerHTML += `<button onclick="filterCat('${child.val().name}')" class="bg-white border border-gray-200 min-w-[35%] py-3 px-4 rounded-2xl snap-center font-bold text-xs hover:bg-blue-600 hover:text-white transition uppercase">${child.val().name}</button>`;
            });
        });

        // LOAD PRODUCTS
        db.ref('products').on('value', snap => {
            window.prods = []; const grid = document.getElementById('grid'); grid.innerHTML = '';
            snap.forEach(child => {
                const p = child.val(); p.id = child.key; window.prods.push(p);
                grid.innerHTML += `<div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer" onclick="view('${p.id}')"><div class="relative w-full h-44"><img src="${p.images[0]}" class="w-full h-full object-cover"><span class="absolute bottom-2 right-2 bg-black/40 text-white text-[8px] px-2 py-0.5 rounded-full z-10 font-bold uppercase">${p.code}</span></div><div class="p-4"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p></div></div>`;
            });
        });

        // Helper Functions (View, Search, etc.)
        function view(id) {
            selected = window.prods.find(x => x.id === id);
            document.getElementById('mName').innerText = selected.name;
            document.getElementById('mCode').innerText = selected.code;
            document.getElementById('mDesc').innerText = selected.desc;
            document.getElementById('mPrice').innerText = selected.price;
            
            const s = document.getElementById('pSlider'); s.innerHTML = '';
            const d = document.getElementById('dotsContainer'); d.innerHTML = '';
            selected.images.forEach((img, index) => {
                s.innerHTML += `<div class="w-full flex-shrink-0 snap-center"><img src="${img}" class="w-full h-full object-cover rounded-2xl"></div>`;
                d.innerHTML += `<div class="slider-dot ${index === 0 ? 'active-dot' : ''}"></div>`;
            });
            s.onscroll = () => {
                const idx = Math.round(s.scrollLeft / s.offsetWidth);
                d.querySelectorAll('.slider-dot').forEach((dot, i) => dot.classList.toggle('active-dot', i === idx));
            };
            document.getElementById('pModal').classList.remove('hidden');
        }

        function filterCat(catName) {
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            window.prods.filter(p => p.category === catName).forEach(p => {
                grid.innerHTML += `<div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer" onclick="view('${p.id}')"><div class="relative w-full h-44"><img src="${p.images[0]}" class="w-full h-full object-cover"><span class="absolute bottom-2 right-2 bg-black/40 text-white text-[8px] px-2 py-0.5 rounded-full z-10 font-bold uppercase">${p.code}</span></div><div class="p-4"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p></div></div>`;
            });
        }

        function search() {
            const val = document.getElementById('search').value.toLowerCase();
            const grid = document.getElementById('grid'); grid.innerHTML = '';
            window.prods.filter(p => p.name.toLowerCase().includes(val) || p.code.toLowerCase().includes(val)).forEach(p => {
                grid.innerHTML += `<div class="bg-white rounded-[28px] shadow-sm border border-gray-100 overflow-hidden relative cursor-pointer" onclick="view('${p.id}')"><div class="relative w-full h-44"><img src="${p.images[0]}" class="w-full h-full object-cover"><span class="absolute bottom-2 right-2 bg-black/40 text-white text-[8px] px-2 py-0.5 rounded-full z-10 font-bold uppercase">${p.code}</span></div><div class="p-4"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-blue-600 font-black text-sm mt-1">Rs. ${p.price}</p></div></div>`;
            });
        }

        // Standard Utility Functions
        function closeSideMenu() { document.getElementById('sideMenu').classList.add('hidden'); }
        function openAuth() { document.getElementById('aModal').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function logout() { auth.signOut(); }
        function login() { auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert(e.message)); }
        function register() { auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert(e.message)); }
        
        function getPinLocation() {
            if (navigator.geolocation) {
                document.getElementById('uAddr').value = "Locating...";
                navigator.geolocation.getCurrentPosition(async position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await res.json();
                        document.getElementById('uAddr').value = data.display_name;
                        if(data.address && (data.address.city || data.address.town || data.address.village)) {
                            document.getElementById('uCity').value = data.address.city || data.address.town || data.address.village;
                        }
                    } catch(e) { document.getElementById('uAddr').value = "Failed to fetch. Please enter manually."; }
                }, error => { alert("Location permission denied."); document.getElementById('uAddr').value = ""; });
            }
        }

        function openOrder() { 
            closeModal('pModal'); document.getElementById('oModal').classList.remove('hidden'); 
            const sizeCats = ["Women Unstitched", "Women Stitched", "Men Stitched", "Kids Clothing", "Boys Stitched"];
            document.getElementById('uSize').classList.toggle('hidden', !sizeCats.includes(selected.category));
        }

        function goConfirm() {
            if(!document.getElementById('uName').value || !document.getElementById('uPhone').value) return alert("Fill details!");
            document.getElementById('fPrice').innerText = `Rs. ${selected.price}`;
            document.getElementById('fTotal').innerText = `Rs. ${parseInt(selected.price) + 150}`;
            document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden');
        }

        function processOrder() {
            if(!currentUser) return alert("Login first!");
            const total = parseInt(selected.price) + 150;
            const orderEntry = {
                userId: currentUser.uid,
                customerName: document.getElementById('uName').value,
                itemName: selected.name,
                itemCode: selected.code,
                itemPrice: selected.price,
                total: total,
                image: selected.images[0],
                phone: document.getElementById('uPhone').value,
                status: "Pending",
                date: new Date().toLocaleString()
            };
            db.ref('orders').push(orderEntry).then(() => {
                const msg = encodeURIComponent(`*NEW ORDER*\nItem: ${selected.name}\nTotal: Rs. ${total}\nName: ${orderEntry.customerName}`);
                window.open(`https://wa.me/923423944508?text=${msg}`, '_blank');
                closeModal('oModal');
            });
        }

        function openOrders() {
            if(!currentUser) return;
            document.getElementById('historyModal').classList.remove('hidden');
            db.ref('orders').orderByChild('userId').equalTo(currentUser.uid).on('value', snap => {
                const list = document.getElementById('myOrderList'); list.innerHTML = '';
                snap.forEach(child => {
                    const o = child.val();
                    list.innerHTML += `<div class="p-4 bg-gray-50 rounded-2xl flex gap-3 border border-gray-100 shadow-sm"><img src="${o.image}" class="w-16 h-16 object-cover rounded-xl"><div><p class="font-bold text-sm">${o.itemName}</p><p class="text-xs font-black mt-1 text-orange-500">Status: ${o.status}</p></div></div>`;
                });
            });
        }
    </script>
</body>
</html>
